# The Pi history source: the conversation history of the Pi coding agent, as a WebAssembly component.
#
# The empty `[workspace]` keeps this source independent of Core's Cargo build; the plugin packager builds it for
# `wasm32-wasip2` and Core's `source test` runs its fixtures through the installed host contract.

[package]
name = "memcastle-source-pi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Generates the guest side of `wit/memcastle-source.wit`.
wit-bindgen = "0.57"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
