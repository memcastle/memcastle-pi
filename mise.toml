# Root task configuration and optional release tooling.

[tools]
bun = "1.4.2"
git-cliff = "2.12.0"

[tasks.package]
description = "Package prebuilt Pi modules with Core"
run = "memcastle plugin package plugin.toml"

[tasks."source:pi:format:check"]
description = "Check formatting for source pi"
dir = "sources/pi"
run = "cargo fmt --all -- --check"

[tasks."source:pi:lint"]
description = "Lint source pi"
dir = "sources/pi"
run = "cargo clippy --locked --target wasm32-wasip3 -- -D warnings"

[tasks."source:pi:test"]
description = "Run native tests for source pi"
dir = "sources/pi"
run = "cargo test --locked --lib"

[tasks."source:pi:build"]
description = "Build the package-ready component for source pi"
dir = "sources/pi"
run = '''
set -eu
cargo build --locked --release --target wasm32-wasip3
metadata="$(cargo metadata --locked --no-deps --format-version 1)"
crate="$(printf '%s' "$metadata" | jq -er '.packages[] | select(.manifest_path == (env.PWD + "/Cargo.toml")) | .targets[] | select(.kind | index("cdylib")) | .name')"
target="$(printf '%s' "$metadata" | jq -er '.target_directory')"
cp "$target/wasm32-wasip3/release/$crate.wasm" source.wasm
'''

[tasks."integration:pi:format:check"]
description = "Run format:check for integration pi"
dir = "integrations/pi"
run = "bun run format:check"

[tasks."integration:pi:lint"]
description = "Run lint for integration pi"
dir = "integrations/pi"
run = "bun run lint"

[tasks."integration:pi:test"]
description = "Run test for integration pi"
dir = "integrations/pi"
run = "bun test --timeout 60000"

[tasks."integration:pi:build"]
description = "Run build for integration pi"
dir = "integrations/pi"
run = "bun run build"
