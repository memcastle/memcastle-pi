format = 1
memcastle = ">=0.4, <0.6"
# Add shared support files or directories here; integration manifests supply their own assets.
artifacts = []

[plugin]
id = "pi"
provider = "pi"
description = "Pi coding-agent history and lifecycle integration"
repository = "https://github.com/memcastle/memcastle-pi"
license = "MIT"



[[modules]]
id = "pi"
type = "source"
manifest = "sources/pi/memcastle-source.toml"
entry = "sources/pi/source.wasm"
contract = "0.4.0"


[[modules]]
id = "pi"
type = "integration"
manifest = "integrations/pi/memcastle-integration.toml"
entry = "integrations/pi/dist/index.js"

