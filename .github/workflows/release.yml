name: Publish pi

on:
  push:
    tags:
      - 'pi/v*'

permissions:
  contents: write

jobs:
  release:
    uses: memcastle/memcastle/.github/workflows/standalone-plugin-release.yaml@2d36e3521a2fe010ec27a9af72affc0447e3ab53
    with:
      core-versions: '[]'
      extra-smoke-command: python3 scripts/smoke_adoption.py
