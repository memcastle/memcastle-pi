name: Plugin validation

on:
  pull_request:
    paths:
      - modules/**
      - plugin.toml
      - tests/**
      - scripts/**
      - .github/workflows/plugin.yml
      - .github/workflows/release.yml
  push:
    paths:
      - modules/**
      - plugin.toml
      - tests/**
      - scripts/**
      - .github/workflows/plugin.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: memcastle/memcastle/.github/workflows/plugin-validation.yaml@2d36e3521a2fe010ec27a9af72affc0447e3ab53
    with:
      core-versions: '[]'
      extra-smoke-command: python3 scripts/smoke_adoption.py
