name: Plugin validation

on:
  pull_request:
    paths:
      - modules/**
      - plugin.toml
      - tests/**
      - scripts/**
      - .github/workflows/plugin.yml
      - .github/workflows/release.yml
  push:
    paths:
      - modules/**
      - plugin.toml
      - tests/**
      - scripts/**
      - .github/workflows/plugin.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build and package pi
        run: python3 scripts/package.py
      - name: Format, lint and test only this provider's modules
        run: python3 scripts/check_modules.py
      - name: Check packaged manifest matches its reviewed source
        run: |
          git diff --exit-code -- plugin.toml || {
            echo "::error::commit the plugin.toml artifact digests produced by packaging"
            exit 1
          }
      - name: Keep source dependency versions reproducible
        run: |
          for manifest in modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              lock="$(dirname "$manifest")/Cargo.lock"
              git ls-files --error-unmatch "$lock" >/dev/null || {
                echo "::error::commit $lock after packaging so release dependencies stay pinned"
                exit 1
              }
            fi
          done
      - name: Download a released Core for source conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core_tag="$(gh release list --repo memcastle/memcastle --limit 1000 --json tagName,isDraft,isPrerelease | python3 scripts/latest_core_release.py)"
          gh release download "$core_tag" --repo memcastle/memcastle --pattern 'memcastle_*_linux-amd64' --dir "$RUNNER_TEMP"
      - name: Exercise each source with the Core host
        run: |
          binary=("$RUNNER_TEMP"/memcastle_*_linux-amd64)
          chmod +x "${binary[0]}"
          for manifest in modules/*/memcastle-source.toml; do
            if [[ -f "$manifest" ]]; then
              "${binary[0]}" source test "$(dirname "$manifest")" --no-build
            fi
          done
      - name: Validate plugin metadata
        run: python3 -m unittest discover -s tests
      - name: Exercise archive installation when released Core supports plugins
        run: |
          binary=("$RUNNER_TEMP"/memcastle_*_linux-amd64)
          if "${binary[0]}" plugin --help >/dev/null 2>&1; then
            MEMCASTLE_BIN="${binary[0]}" python3 scripts/smoke_install.py
          else
            echo 'Latest released Core predates plugin installation; current-Core contract CI runs the archive smoke test.'
          fi
